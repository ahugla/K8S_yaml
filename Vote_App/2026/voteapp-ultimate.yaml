
# with PVC for redis DB mounted on /bitnami/redis/data
# with dependencies (frontend wait for redis backend)
# official tagging
# ready for istio/kiali 
# dans existing namespace "voteapp"
# with frontend in version v1.0
# test de charge :   watch -n 2  "curl -s 'IP' | grep title"


apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: voteapp-redis-pvc
  namespace: voteapp
  labels:
    #app.kubernetes.io/component: vote-backend-pvc
    app.kubernetes.io/name: voteapp
    app.kubernetes.io/part-of: voteapp
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: vsan-default-storage-policy
  resources:
    requests:
        storage: 1Gi


---


apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-backend
  namespace: voteapp
  labels:
    app.kubernetes.io/name: voteapp
    app.kubernetes.io/component: vote-backend
    app.kubernetes.io/part-of: voteapp
    app.kubernetes.io/version: "1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: vote-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voteapp
        app.kubernetes.io/component: vote-backend
        app.kubernetes.io/part-of: voteapp
        app.kubernetes.io/version: "1.0"
    spec:
      containers:
      - name: vote-backend
        image: harbor.labfr.com/voteapp/vote-app-backend:v1.0
        env:
        - name: ALLOW_EMPTY_PASSWORD
          value: "yes"
        ports:
        - containerPort: 6379
          name: redis
        volumeMounts:
        - name: redis-slave-data
          mountPath: "/bitnami/redis/data"
      securityContext:
        fsGroup: 1001 
      imagePullSecrets:
      - name: harbor-credentials
      volumes:
      - name: redis-slave-data
        persistentVolumeClaim:
          claimName: voteapp-redis-pvc


---


apiVersion: v1
kind: Service
metadata:
  name: vote-backend
  namespace: voteapp
  labels:
    app.kubernetes.io/name: voteapp
    app.kubernetes.io/part-of: voteapp
spec:
  ports:
    - name: tcp-redis
      port: 6379
  selector:
    app.kubernetes.io/component: vote-backend


---


apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-frontend-v1
  namespace: voteapp
  labels:
    app.kubernetes.io/name: voteapp
    app.kubernetes.io/component: vote-frontend
    app.kubernetes.io/part-of: voteapp
    app.kubernetes.io/version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: vote-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voteapp
        app.kubernetes.io/component: vote-frontend
        app.kubernetes.io/part-of: voteapp
        app.kubernetes.io/version: "1.0"
    spec:
      initContainers:
      - name: check-db
        image: busybox:1.28
        command: ['sh', '-c', 'until nc -z -v -w3 vote-backend 6379; do echo "Attente de la base de données..."; sleep 2; done']
      containers:
      - name: vote-frontend
        image: harbor.labfr.com/voteapp/vote-app-frontend:v1.0
        ports:
        - containerPort: 80
        env:
        - name: REDIS
          value: "vote-backend"
      imagePullSecrets:
      - name: harbor-credentials

---


apiVersion: v1
kind: Service
metadata:
  name: vote-frontend
  namespace: voteapp
  labels:
    app.kubernetes.io/name: voteapp
    app.kubernetes.io/part-of: voteapp
spec:
  type: LoadBalancer
  ports:
    - name: http-frontend
      port: 80
  selector:
    app.kubernetes.io/component: vote-frontend
